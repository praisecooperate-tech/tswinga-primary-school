/* =========================
   HERO FIX (VERY IMPORTANT)
========================= */
.hero-premium {
  position: relative;
}

.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4); /* darker, not white */
  z-index: 1;
}

.hero-text {
  position: relative;
  z-index: 2;
  color: white;
}

/* =========================
   PLANNER
========================= */
.planner-container {
  max-width: 1100px;
  margin: auto;
  padding: 40px;
}

.planner-card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.planner-card.done {
  background: #e6ffe6;
  text-decoration: line-through;
}

.planner-card input {
  width: 20px;
  height: 20px;
}

/* =========================
   CALENDAR
========================= */
#calendar {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 16px;
  max-height: 400px;
  overflow-y: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.month {
  margin-bottom: 25px;
}

.month h3 {
  text-align: center;
  margin-bottom: 10px;
  color: black;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  font-size: 12px;
}

.calendar-grid div {
  padding: 6px;
  text-align: center;
  border-radius: 6px;
  user-select: none;
  background: #f5f5f5;
}

.calendar-grid strong {
  color: black;
}

.today {
  background: #0b2f6b !important;
  color: white;
}

</style>

// =========================
// SAVE SYSTEM
// =========================
let saved = JSON.parse(localStorage.getItem("planner")) || {};
const container = document.getElementById("planner-list");

events.forEach((event, index) => {

  const div = document.createElement("div");
  div.className = "planner-card";

  if (saved[index]) div.classList.add("done");

  div.innerHTML = `
    <span>${event}</span>
    <input type="checkbox" ${saved[index] ? "checked" : ""}>
  `;

  const checkbox = div.querySelector("input");

  checkbox.addEventListener("change", () => {
    saved[index] = checkbox.checked;
    localStorage.setItem("planner", JSON.stringify(saved));
    div.classList.toggle("done");
  });

  container.appendChild(div);
});

// =========================
// FULL 2026 CALENDAR
// =========================
function generateCalendar() {

  const calendar = document.getElementById("calendar");
  const year = 2026;

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  let html = "";

  for (let m = 0; m < 12; m++) {

    const firstDay = new Date(year, m, 1).getDay();
    const daysInMonth = new Date(year, m + 1, 0).getDate();

    html += `<div class="month">`;
    html += `<h3>${months[m]} 2026</h3>`;
    html += `<div class="calendar-grid">`;

    days.forEach(d => html += `<div><strong>${d}</strong></div>`);

    for (let i = 0; i < firstDay; i++) {
      html += `<div></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      html += `<div>${d}</div>`;
    }

    html += `</div></div>`;
  }

  calendar.innerHTML = html;
}

generateCalendar();
